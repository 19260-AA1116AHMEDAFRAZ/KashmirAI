<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KashmirAI App Prototype</title>
<style>
:root{--ink:#1B2621;--muted:#4A5A52;--bg:#F4F2EC;--line:#DCE3DE;--deep:#15503C;--green:#2E7D57;--mint:#DCE8DF;--gold:#D4A72C;--clay:#B5532E;--seg:#E6EAE4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E4E1D8;color:var(--ink);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--deep)}
.top{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:760px;text-align:center}
.top h1{margin:0;font-size:20px}
.top p{margin:0;font-size:13px;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.jump a{font-size:12px;font-weight:700;text-decoration:none;padding:6px 10px;border-radius:99px;background:#FFF;border:1px solid var(--line)}
.jump a.on{background:var(--deep);color:#FFF;border-color:var(--deep)}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #1B2621,0 24px 60px rgba(0,0,0,.25);flex-shrink:0;position:relative}
@media (max-width:440px){body{padding:0;gap:0}.top{display:none}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.scr{height:100%;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:52px 20px 20px}
.urdu{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif}
.h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
.h2{margin:0;font-size:17px;font-weight:800}
.muted{color:var(--muted)}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.card{background:#FFF;border:1px solid var(--line);border-radius:16px}
.pill{border-radius:14px;font-size:14px;font-weight:700;background:#FFF;border:2px solid var(--line);color:var(--ink)}
.pill.on{background:var(--mint);border-color:var(--green);color:var(--deep)}
.chip{flex-shrink:0;height:40px;padding:0 16px;border-radius:99px;font-size:14px;font-weight:700;background:#FFF;border:1px solid var(--line)}
.chip.on{background:var(--deep);color:#FFF;border-color:var(--deep)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--seg)}
.seg button{height:40px;border:0;border-radius:10px;font-size:14px;font-weight:700;background:transparent;color:var(--muted)}
.seg button.on{background:#FFF;color:var(--deep)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:16px;font-size:16px;font-weight:700;text-decoration:none;border:0}
.btn.primary{background:var(--deep);color:#FFF}
.btn.outline{background:#FFF;color:var(--deep);border:2px solid var(--deep)}
.btn.soft{background:var(--mint);color:var(--deep);border:2px solid var(--green)}
.round{width:44px;height:44px;border-radius:22px;background:#FFF;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;text-decoration:none}
.bar{display:flex;gap:10px;padding:12px 20px 24px;background:#FFF;border-top:1px solid var(--line);flex-shrink:0}
.nav{display:flex;justify-content:space-around;align-items:center;height:80px;padding:0 8px 12px;background:#FFF;border-top:1px solid var(--line);flex-shrink:0}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:72px;min-height:52px;text-decoration:none;font-size:11px;font-weight:600;color:var(--muted)}
.nav a span{display:flex;padding:4px 16px;border-radius:99px}
.nav a.on{color:var(--deep);font-weight:700}
.nav a.on span{background:var(--mint)}
.credit{position:absolute;right:12px;font-size:11px;font-weight:600;color:#FFF;padding:3px 8px;border-radius:99px;background:rgba(27,38,33,.7)}
.thumb{width:96px;height:96px;border-radius:12px;flex-shrink:0;object-fit:cover;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input::placeholder{color:#5F6E66}
</style>
</head>
<body>
<header class="top">
  <h1>KashmirAI · clickable app prototype</h1>
  <p>Tap through the app inside the phone, or jump to any screen. Works offline.</p>
  <nav class="jump" id="jump" aria-label="Jump to screen"></nav>
</header>
<main class="phone" id="app" aria-live="polite"></main>

const CITIES = [['isb', 'Islamabad', 14000], ['mzd', 'Muzaffarabad', 8000], ['rwk', 'Rawalakot', 12000], ['bagh', 'Bagh', 10000]];

const STYLES = [['budget', 'Budget', 'Guesthouses', 4000], ['comfort', 'Comfort', 'Hotels', 7000], ['premium', 'Premium', 'Resorts', 12000]];
function estimate() {
  const p = S.plan;
  const city = CITIES.find((c) => c[0] === p.city), d = DESTS.find((x) => x[0] === p.place), st = STYLES.find((x) => x[0] === p.style);
  const raw = st[3] * p.days * p.people + Math.max(4000, city[2] + d[2]) * Math.ceil(p.people / 4);
  const total = Math.round(raw / 500) * 500;
  return { total, per: Math.round(total / p.people / 100) * 100 };
}

      <div style="display:flex;flex-direction:column;gap:2px"><h1 class="h1" style="font-size:22px">Neelum Valley · 3 days</h1><span class="muted" style="font-size:13px">From Islamabad · 2 travellers · Budget</span></div></div>
    <div style="display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:var(--deep);color:#FFF">
      <div style="display:flex;align-items:flex-end;justify-content:space-between"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;color:#D5E6DB">Estimated total</span><span style="font-size:32px;font-weight:800;letter-spacing:-.8px">Rs 38,000</span></div><span style="font-size:13px;font-weight:600;color:#D5E6DB">Rs 19,000 / person</span></div>
      <div style="display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px" role="img" aria-label="Budget split: transport 37%, stay 32%, food 21%, extras 10%">${costs.map((c) => `<span style="width:${c[3]}%;background:${c[2]}"></span>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px">${costs.map((c) => `<div style="display:flex;gap:8px"><span style="width:10px;height:10px;border-radius:3px;margin-top:4px;flex-shrink:0;background:${c[2]}"></span><div style="display:flex;flex-direction:column"><span style="font-size:12px;color:#D5E6DB">${c[0]}</span><span style="font-size:15px;font-weight:700">${c[1]}</span></div></div>`).join('')}</div>
    </div>
    <div class="seg" role="tablist">${[1, 2, 3].map((n) => btn('day', n, S.day === n ? 'on' : '', 'Day ' + n, `role="tab" aria-selected="${S.day === n}"`)).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:4px"><h2 class="h2" style="margin-bottom:6px">${title}</h2>
      ${steps.map(([t, w, n]) => `<div style="display:flex;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0"><span style="width:12px;height:12px;border-radius:6px;background:var(--green);margin-top:4px"></span><span style="flex:1;width:2px;background:#C9D6CD"></span></div>
        <div style="display:flex;flex-direction:column;gap:2px;padding-bottom:14px"><span style="font-size:12px;font-weight:700;color:var(--green)">${t}</span><span style="font-size:15px;font-weight:700">${w}</span><span class="muted" style="font-size:13px">${n}</span></div></div>`).join('')}</div>
    ${btn('offline', '', 'btn ' + (S.offline ? 'soft' : 'outline'), ic('download', 20) + (S.offline ? 'Saved offline · works without signal' : 'Save plan offline'), `aria-pressed="${S.offline}" style="height:52px;font-size:15px"`)}
    <div style="display:flex;gap:14px;align-items:center;padding:16px;border-radius:18px;background:#FFF;border:1.5px dashed var(--gold)">
      <div style="width:44px;height:44px;border-radius:12px;background:#FBF3DC;display:flex;align-items:center;justify-content:center;flex-shrink:0">${spark(22, '#B8891A')}</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">Trip Planner Pro · Rs 300</span><span class="muted" style="font-size:13px;line-height:1.4">Offline maps, driver contacts and a packing list for this trip.</span></div>
    </div>
  </div>
  <div class="bar" style="padding-bottom:28px"><a href="#partners" class="btn primary" style="flex:1">Book stays &amp; jeep${ic('arrow', 20)}</a></div></div>`;
}

/* ---------- 6 Chat ---------- */
const QA = {
  en: [['Best time for Neelum?', 'May to October is best. June and July are greenest. Roads past Kel can close from December to March.'], ['Cheap stays in Sharda?', 'Guesthouses in Sharda start around Rs 4,000 to 6,000 a night for two. I can show partner stays with reviews.'], ['Emergency number?', 'Rescue 1122 for ambulance and rescue. Police 15. Both are saved in your Trips tab and work offline.']],
  roman: [['Neelum ka budget?', '3 din, 2 log, budget style: lagbhag Rs 38,000. Transport Rs 14,000, rehna Rs 12,000, khana Rs 8,000.'], ['Banjosa kab jayein?', 'April se October best hai. Rawalakot se sirf 20 minute. Sardiyon mein jheel jam bhi jati hai.'], ['Jeep kahan milegi?', 'Kel bazaar mein jeep stand hai. App mein 3 verified drivers hain, Rs 6,000 approx per din.']],
  ur: [['نیلم کا بجٹ؟', 'تین دن، دو افراد: تقریباً 38,000 روپے۔ سفر، رہائش اور کھانا شامل۔'], ['بنجوسہ کب جائیں؟', 'اپریل سے اکتوبر بہترین ہے۔ راولاکوٹ سے صرف بیس منٹ۔'], ['ایمرجنسی نمبر؟', 'ریسکیو 1122 اور پولیس 15۔ یہ نمبر آف لائن بھی دستیاب ہیں۔']]
};
const FALLBACK = { en: 'Good question! In the full app, live AI answers this using checked local data. Try a suggestion below.', roman: 'Acha sawal! Asli app mein live AI local data se jawab dega. Neeche diye sawal try karein.', ur: 'اچھا سوال! اصل ایپ میں لائیو اے آئی مقامی معلومات سے جواب دے گی۔' };
function ask() {
  const L = S.chatLang;
  const ph = { en: 'Ask about places, roads, prices…', roman: 'Kuch bhi poochein…', ur: 'یہاں سوال لکھیں…' }[L];
  return `<div class="scr">
    <div style="display:flex;flex-direction:column;gap:12px;padding:48px 20px 12px;background:#FFF;border-bottom:1px solid var(--line);flex-shrink:0">
      <div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:14px;background:var(--deep);display:flex;align-items:center;justify-content:center;flex-shrink:0">${spark(22, '#D4A72C')}</div>
        <div style="display:flex;flex-direction:column;gap:1px"><h1 style="margin:0;font-size:18px;font-weight:800">Ask KashmirAI</h1><span style="font-size:12px;color:var(--green);font-weight:600">Local answers · English, اردو, Roman Urdu</span></div></div>
      <div class="seg" role="group" aria-label="Reply language">${[['en', 'English'], ['ur', 'اردو'], ['roman', 'Roman Urdu']].map(([id, l]) => btn('clang', id, (L === id ? 'on' : '') + (id === 'ur' ? ' urdu' : ''), l, `aria-pressed="${L === id}" style="height:36px;font-size:13px"`)).join('')}</div>
    </div>
    <div id="msgs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 16px 8px">
      <span class="muted" style="align-self:center;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--seg)">Today</span>
      ${S.msgs.map((m) => `<div style="display:flex;justify-content:${m.me ? 'flex-end' : 'flex-start'}"><div class="${m.lang === 'ur' ? 'urdu' : ''}" style="max-width:78%;padding:11px 14px;font-size:14px;line-height:${m.lang === 'ur' ? 2 : 1.5};${m.lang === 'ur' ? 'direction:rtl;text-align:right;' : ''}${m.me ? 'background:var(--deep);color:#FFF;border-radius:18px 18px 4px 18px' : 'background:#FFF;border:1px solid var(--line);border-radius:18px 18px 18px 4px'}">${esc(m.text)}</div></div>`).join('')}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;padding:10px 16px 12px;flex-shrink:0">
      <div style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px">${QA[L].map((q, i) => btn('ask', i, L === 'ur' ? 'urdu' : '', q[0], 'style="flex-shrink:0;height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--green);background:#FFF;color:var(--deep);font-size:13px;font-weight:700"')).join('')}</div>
      <form id="chatform" style="display:flex;gap:8px;align-items:center">
        <label class="card" style="flex:1;display:flex;align-items:center;height:52px;padding:0 16px;border-radius:26px"><span class="sr">Message</span><input id="draft" type="text" value="${esc(S.draft)}" placeholder="${ph}" style="flex:1;border:0;outline:none;background:transparent;font-size:15px"></label>
        <button type="submit" aria-label="Send" style="width:52px;height:52px;border-radius:26px;border:0;background:var(--deep);color:#FFF;display:flex;align-items:center;justify-content:center;flex-shrink:0">${ic('send')}</button>
      </form>
    </div>${nav('ask')}</div>`;
}

/* ---------- 7 Partners ---------- */
const PARTNERS = {
  stays: [['s1', 'Riverside Guesthouse', 'Keran · 4 rooms · river view', 'Rs 6,000', 'per night · 2 guests', true], ['s2', 'Sharda Valley Inn', 'Sharda · hot water · parking', 'Rs 5,000', 'per night · 2 guests', false], ['s3', 'Kel Wooden Huts', 'Kel · near jeep stand', 'Rs 6,000', 'per night · 2 guests', false]],
  guides: [['g1', 'Tariq · Valley guide', 'Keran to Arang Kel · Urdu, English', 'Rs 3,500', 'per day', true], ['g2', 'Saima · Trek guide', 'Family and women groups · Urdu', 'Rs 4,000', 'per day', false]],
  jeeps: [['j1', 'Kel Jeep Service', 'Kel ↔ Arang Kel base · 6 seats', 'Rs 6,000', 'per day', true], ['j2', 'Neelum 4x4', 'Pickup from Muzaffarabad · 7 seats', 'Rs 9,000', 'per day', false]]
};
function partners() {
  return `<div class="scr">
    <div style="display:flex;flex-direction:column;gap:14px;padding:48px 20px 14px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:12px"><a href="#trip" class="round" aria-label="Back to your trip">${ic('back')}</a>
        <div style="display:flex;flex-direction:column;gap:2px"><h1 class="h1" style="font-size:22px">Local partners</h1><span class="muted" style="font-size:13px">Neelum Valley · verified each season</span></div></div>
      <div class="seg" role="tablist">${[['stays', 'Stays'], ['guides', 'Guides'], ['jeeps', 'Jeeps']].map(([id, l]) => btn('ptab', id, S.ptab === id ? 'on' : '', l, `role="tab" aria-selected="${S.ptab === id}"`)).join('')}</div>
    </div>
    <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 20px 20px">
      ${PARTNERS[S.ptab].map(([id, n, d, pr, u, f]) => { const r = !!S.req[id]; return `<div style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:#FFF;border:${f ? '2px solid var(--gold)' : '1px solid var(--line)'}">
        <div style="display:flex;gap:12px;align-items:flex-start"><div style="width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0;${f ? 'background:var(--deep);color:#FFF' : 'background:var(--mint);color:var(--deep)'}">${n[0]}</div>
          <div style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0">${f ? '<span style="align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#FBF3DC;color:#7A5A0E">Featured</span>' : ''}
            <span style="font-size:16px;font-weight:700">${n}</span><span class="muted" style="font-size:13px">${d}</span>
            <span style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--green)">${ic('shieldok', 16, 'currentColor', 2.2)}Verified by KashmirAI</span></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)">
          <div style="display:flex;flex-direction:column"><span style="font-size:17px;font-weight:800">${pr}</span><span class="muted" style="font-size:12px">${u}</span></div>
          ${btn('req', id, 'btn ' + (r ? 'soft' : 'primary'), r ? 'Requested' : 'Request', `aria-pressed="${r}" style="height:46px;padding:0 20px;font-size:14px;border-radius:14px${r ? '' : ';border:2px solid var(--deep)'}"`)}
        </div></div>`; }).join('')}
      <p class="muted" style="margin:4px 0 0;font-size:12px;line-height:1.5;text-align:center">Sample partners for this prototype. Every booking helps local guesthouses, guides and drivers.</p>
    </div></div>`;
}

/* ---------- 8 Trips & safety ---------- */
const PACK = [['cnic', 'CNIC / ID card'], ['cash', 'Cash for jeeps and food'], ['jacket', 'Warm jacket and rain cover'], ['power', 'Power bank'], ['meds', 'Basic medicines']];
function trips() {
  const packed = PACK.filter(([id]) => S.done[id]).length;
  return `<div class="scr"><div class="scroll" style="gap:20px">
    <div style="display:flex;align-items:center;justify-content:space-between"><h1 class="h1">My trips</h1>
      <span style="display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--mint);color:var(--deep);font-size:12px;font-weight:700">${ic('download', 16, 'currentColor', 2.2)}Ready offline</span></div>
    <a href="#trip" class="card" style="display:flex;flex-direction:column;border-radius:20px;overflow:hidden;text-decoration:none;color:var(--ink)">
      <img src="${IMG.neelum}" alt="Neelum Valley" style="display:block;width:100%;height:130px;object-fit:cover">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:700">Neelum Valley · 3 days</span><span class="muted" style="font-size:13px">2 travellers · Rs 38,000 est.</span></div><span style="font-size:13px;font-weight:700;color:var(--deep)">Open</span></div>
    </a>
    <div style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">Safety on the road</h2>
      <div class="card" style="display:flex;gap:12px;align-items:center;padding:14px">${ic('sun', 36, '#B8891A', 1.8)}<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">Kel today · 14°C</span><span class="muted" style="font-size:13px">Sunny morning, light rain after 3 pm</span></div></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <a href="tel:1122" style="display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--clay);color:#FFF;text-decoration:none">${ic('phone')}<span style="font-size:20px;font-weight:800">1122</span><span style="font-size:12px;font-weight:600">Rescue &amp; ambulance</span></a>
        <a href="tel:15" style="display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--deep);color:#FFF;text-decoration:none">${ic('shield')}<span style="font-size:20px;font-weight:800">15</span><span style="font-size:12px;font-weight:600">Police</span></a>
      </div></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2 class="h2">Packing list</h2><span class="muted" style="font-size:13px;font-weight:600">${packed} of ${PACK.length} packed</span></div>
      <div class="card" style="display:flex;flex-direction:column;overflow:hidden">${PACK.map(([id, t]) => { const on = !!S.done[id]; return btn('pack', id, '', `<span style="width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;${on ? 'background:var(--green);border:2px solid var(--green)' : 'background:#FFF;border:2px solid #8A9A91'}">${ic('check', 16, '#FFF', 3)}</span><span style="${on ? 'color:var(--muted);text-decoration:line-through' : ''}">${t}</span>`, `role="checkbox" aria-checked="${on}" style="display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:0;border-bottom:1px solid #E6EAE4;background:#FFF;text-align:left;font-size:15px"`); }).join('')}</div>
    </div>
  </div>${nav('trips')}</div>`;
}

/* ---------- routing + events ---------- */
const VIEWS = { welcome, home, place, plan, trip, ask, partners, trips };
const app = document.getElementById('app');
function current() { const h = location.hash.slice(1); return VIEWS[h] ? h : 'welcome'; }
function render(keepScroll) {
  const sc = keepScroll ? [...app.querySelectorAll('.scroll, [style*="overflow-y:auto"]')].map((e) => e.scrollTop) : null;
  const id = current();
  app.innerHTML = VIEWS[id]();
  if (sc) [...app.querySelectorAll('.scroll, [style*="overflow-y:auto"]')].forEach((e, i) => { if (sc[i] != null) e.scrollTop = sc[i]; });
  const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight;
  document.getElementById('jump').innerHTML = SCREENS.map(([h, l], i) => `<a href="#${h}" class="${h === id ? 'on' : ''}">${i + 1} · ${l}</a>`).join('');
}
window.addEventListener('hashchange', () => render(false));
function pushChat(q, a) { S.msgs.push({ me: true, lang: S.chatLang, text: q }, { me: false, lang: S.chatLang, text: a }); S.draft = ''; }
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v, P2 = S.plan;
  switch (b.dataset.act) {
    case 'lang': S.lang = v; break;
    case 'filter': S.filter = v; break;
    case 'dtab': S.destTab = v; break;
    case 'save': S.saved = !S.saved; break;
    case 'city': P2.city = v; break;
    case 'dest': P2.place = v; break;
    case 'style': P2.style = v; break;
    case 'step': { const [k, d] = v.split(':'); const max = k === 'days' ? 7 : 12; P2[k] = Math.min(max, Math.max(1, P2[k] + Number(d))); break; }
    case 'day': S.day = Number(v); break;
    case 'offline': S.offline = !S.offline; break;
    case 'clang': S.chatLang = v; break;
    case 'ask': { const q = QA[S.chatLang][Number(v)]; pushChat(q[0], q[1]); break; }
    case 'ptab': S.ptab = v; break;
    case 'req': S.req[v] = !S.req[v]; break;
    case 'pack': S.done[v] = !S.done[v]; break;
  }
  render(true);
});
app.addEventListener('input', (e) => { if (e.target.id === 'draft') S.draft = e.target.value; });
app.addEventListener('submit', (e) => {
  if (e.target.id !== 'chatform') return;
  e.preventDefault();
  const t = S.draft.trim(); if (!t) return;
  pushChat(t, FALLBACK[S.chatLang]); render(true);
  const d = document.getElementById('draft'); if (d) d.focus();
});
render(false);
</script>
</body>
</html>
